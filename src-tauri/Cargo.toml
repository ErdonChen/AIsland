[package]
name = "aiceland"
version = "0.1.0"
description = "A local-first multi-agent status island for Windows"
authors = ["Erdon Chen", "AIsland contributors"]
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/ErdonChen/AIsland"
homepage = "https://github.com/ErdonChen/AIsland"
readme = "../README.md"

[lib]
name = "aiceland_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
arboard = "3.6.1"
async-trait = "0.1.91"
base64 = "0.22.1"
image = { version = "0.25.10", default-features = false, features = ["bmp", "png"] }
log = "0.4"
notify = "8.2.0"
quick-xml = "0.41.0"
rodio = { version = "0.22.2", default-features = false, features = ["playback", "mp3", "wav", "flac", "vorbis"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9.34"
sha2 = "0.10.9"
toml_edit = "=0.25.13"
tauri = { version = "=2.11.5", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
tauri-plugin-notification = "2.3.3"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "sync", "test-util", "time"] }
uuid = { version = "1.24.0", features = ["v4", "serde"] }

[target.'cfg(windows)'.dependencies]
clipboard-win = "5.4.1"
windows = { version = "=0.61.3", features = ["Data_Xml_Dom", "UI_Notifications", "Foundation", "Foundation_Collections", "Media_Control", "ApplicationModel_Activation", "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Storage_EnhancedStorage", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_DataExchange", "Win32_System_Diagnostics_Debug", "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_System_Performance", "Win32_System_ProcessStatus", "Win32_System_Registry", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_System_Variant", "Win32_Security", "Win32_UI_Notifications", "Win32_UI_Shell", "Win32_UI_Shell_PropertiesSystem", "Win32_UI_WindowsAndMessaging"] }
window-vibrancy = "0.6"

[target.'cfg(target_os = "windows")'.dependencies]
webview2-com = "=0.38.2"
windows-core = "=0.61.2"

[dev-dependencies]
tempfile = "3.27.0"
