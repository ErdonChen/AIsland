<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0C2138"/>
      <stop offset="1" stop-color="#174A73"/>
    </linearGradient>
    <radialGradient id="glow3" cx="0.5" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#49A6E8" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#49A6E8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="peak3" x1="0" y1="0" x2="0.6" y2="1">
