      <stop offset="1" stop-color="#4FAEE8"/>
    </linearGradient>
    <linearGradient id="snow3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#DDF2FF"/>
    </linearGradient>
    <linearGradient id="water3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8FE3FF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#CFF6FF"/>
      <stop offset="1" stop-color="#8FE3FF" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft3" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" rx="225" fill="url(#bg3)"/>
  <ellipse cx="512" cy="430" rx="400" ry="350" fill="url(#glow3)"/>

