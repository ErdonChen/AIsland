name: Bug report
description: Report a reproducible AIsland problem
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: Do not include credentials, private Agent conversations, reasoning, tool output, or unredacted personal data. Report security issues privately through SECURITY.md.
  - type: dropdown
    id: platform
    attributes:
      label: Windows version
      options:
        - Windows 11 x64
        - Windows 10 x64
        - WSL integration
        - Other or unknown
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: AIsland version or commit
      placeholder: v0.1.0 or commit hash
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Use synthetic or redacted examples only.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Data safety
      options:
        - label: I removed secrets, personal paths, and private conversation content.
          required: true
        - label: This is not a security vulnerability.
          required: true
