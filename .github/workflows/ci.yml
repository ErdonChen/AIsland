name: Community quality gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: community-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  dco:
    name: Verify DCO sign-offs
    if: github.event_name == 'pull_request'
    runs-on: windows-2022
    steps:
      - name: Check out pull request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Require a matching sign-off on every commit
        shell: pwsh
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          $failed = @()
          $commits = @(git rev-list "$env:BASE_SHA..$env:HEAD_SHA")
          foreach ($commit in $commits) {
            $authorName = git show -s --format=%an $commit
            $authorEmail = git show -s --format=%ae $commit
            $required = "Signed-off-by: $authorName <$authorEmail>"
            $message = git show -s --format=%B $commit | Out-String
            if ($message -notmatch "(?im)^$([regex]::Escape($required))\s*$") {
              $failed += "$commit requires '$required'"
            }
          }
          if ($failed.Count -gt 0) {
            $failed | ForEach-Object { Write-Error $_ }
            throw "DCO verification failed. Amend each commit with git commit -s."
          }

  quality-gate:
    name: Windows tests and builds
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.15.0
          run_install: false
      - name: Install Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: pnpm
      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt
      - name: Cache Rust build outputs
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: ./src-tauri -> target
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
      - name: Run frontend tests
        run: pnpm test
      - name: Build frontend
        run: pnpm build
      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - name: Check dependency licenses
        run: node scripts/check-license-policy.mjs
      - name: Build the Windows application without a distributable bundle
        run: pnpm tauri build --no-bundle
