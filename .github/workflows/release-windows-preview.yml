name: Release unsigned Windows preview

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Preview tag in the form preview-v0.1.0.1
        required: true
        type: string
      publish:
        description: Publish the verified draft as a GitHub Pre-release
        required: true
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-windows-preview-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  release-windows-preview:
    name: Build and publish unsigned Windows preview
    runs-on: windows-2022
    timeout-minutes: 60

    steps:
      - name: Check out the source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Resolve and verify the preview version
        shell: pwsh
        env:
          PREVIEW_INPUT_TAG: ${{ inputs.tag }}
          PREVIEW_SOURCE_REF: ${{ github.ref }}
        run: |
          if ($env:PREVIEW_SOURCE_REF -ne "refs/heads/main") {
            throw "Unsigned previews must be dispatched from the main branch, not '$env:PREVIEW_SOURCE_REF'."
          }
          $tag = $env:PREVIEW_INPUT_TAG.Trim()
          if ($tag -notmatch '^preview-v(?<version>\d+\.\d+\.\d+)\.(?<iteration>[1-9]\d*)$') {
            throw "Preview tag '$tag' must match preview-v<app-version>.<positive iteration>, for example preview-v0.1.0.1."
          }
          $tagVersion = $Matches.version
          $iteration = $Matches.iteration

          $packageVersion = (Get-Content -Raw -LiteralPath package.json | ConvertFrom-Json).version
          $tauriVersion = (Get-Content -Raw -LiteralPath src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $cargoToml = Get-Content -Raw -LiteralPath src-tauri/Cargo.toml
          $packageSection = [regex]::Match($cargoToml, '(?ms)^\[package\]\s*(?<body>.*?)(?=^\[|\z)')
          $cargoVersionMatch = [regex]::Match($packageSection.Groups['body'].Value, '(?m)^version\s*=\s*"(?<version>[^"]+)"')
          if (-not $packageSection.Success -or -not $cargoVersionMatch.Success) {
            throw "Could not read the Rust package version from src-tauri/Cargo.toml."
          }
          $cargoVersion = $cargoVersionMatch.Groups['version'].Value

          $versions = @($tagVersion, $packageVersion, $tauriVersion, $cargoVersion) | Select-Object -Unique
          if ($versions.Count -ne 1) {
            throw "Version mismatch: tag=$tagVersion package=$packageVersion tauri=$tauriVersion cargo=$cargoVersion"
          }
          if (@(git tag --list $tag).Count -ne 0) {
            throw "Preview tag '$tag' already exists. Use a new iteration number."
          }

          "PREVIEW_TAG=$tag" >> $env:GITHUB_ENV
          "APP_VERSION=$tagVersion" >> $env:GITHUB_ENV
          "PREVIEW_ITERATION=$iteration" >> $env:GITHUB_ENV
          "PREVIEW_TITLE=AIsland v$tagVersion - Unsigned Preview $iteration" >> $env:GITHUB_ENV

      - name: Install pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.15.0
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Cache Rust build outputs
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify the preview release workflow contract
        run: node --test .github/scripts/verify-preview-release-workflow.mjs

      - name: Run frontend tests
        run: pnpm test

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked

      - name: Build the unsigned NSIS installer
        run: pnpm tauri build --bundles nsis --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: Verify the unsigned installer and generate its checksum
        shell: pwsh
        run: |
          $bundleRoot = Resolve-Path -LiteralPath src-tauri/target/release/bundle
          $installers = @(Get-ChildItem -LiteralPath (Join-Path $bundleRoot "nsis") -Filter *.exe -File)
          if ($installers.Count -ne 1) {
            throw "Expected exactly one NSIS installer, found $($installers.Count)."
          }

          $signature = Get-AuthenticodeSignature -LiteralPath $installers[0].FullName
          $signature | Format-List Status, StatusMessage, SignerCertificate, TimeStamperCertificate
          if ($signature.Status -ne [System.Management.Automation.SignatureStatus]::NotSigned) {
            throw "Expected Authenticode status NotSigned, received $($signature.Status)."
          }

          $forbidden = @(Get-ChildItem -LiteralPath $bundleRoot -Recurse -File | Where-Object {
            $_.Name -eq "latest.json" -or $_.Extension -eq ".sig"
          })
          if ($forbidden.Count -ne 0) {
            throw "Unsigned previews must not contain updater metadata: $($forbidden.FullName -join ', ')"
          }

          $stagingRoot = Join-Path $env:RUNNER_TEMP "aiceland-unsigned-preview"
          New-Item -ItemType Directory -Path $stagingRoot -Force | Out-Null
          $stagedInstaller = Join-Path $stagingRoot $installers[0].Name
          Copy-Item -LiteralPath $installers[0].FullName -Destination $stagedInstaller

          $hash = Get-FileHash -LiteralPath $stagedInstaller -Algorithm SHA256
          $checksumPath = Join-Path $stagingRoot "SHA256SUMS.txt"
          "{0}  {1}" -f $hash.Hash.ToLowerInvariant(), $installers[0].Name |
            Set-Content -LiteralPath $checksumPath -Encoding ascii

          $notesPath = Join-Path $stagingRoot "release-notes.md"
          @(
            "> [!WARNING]",
            "> This is an unsigned technical preview for testing only. Windows SmartScreen",
            "> and UAC may show Unknown publisher. Download it only from the official",
            "> AIsland GitHub repository and verify the SHA-256 checksum before running it.",
            "> Do not disable Microsoft Defender or SmartScreen.",
            "",
            "## Build provenance",
            "",
            "- Source repository: https://github.com/$env:GITHUB_REPOSITORY",
            "- Source commit: $env:GITHUB_SHA",
            "- Platform: Windows 11 x64 build runner",
            "- Package: NSIS installer",
            "- Authenticode status: NotSigned",
            "- SHA-256: see SHA256SUMS.txt",
            "",
            "## Scope",
            "",
            "- Intended for technical evaluation, not ordinary users or production use.",
            "- This Pre-release is not served through AIsland's stable updater channel.",
            "- A stable release will require a trusted Authenticode signature and the signed-release gate."
          ) | Set-Content -LiteralPath $notesPath -Encoding utf8

          "PREVIEW_INSTALLER=$stagedInstaller" >> $env:GITHUB_ENV
          "PREVIEW_ASSET_NAME=$($installers[0].Name)" >> $env:GITHUB_ENV
          "PREVIEW_CHECKSUM=$checksumPath" >> $env:GITHUB_ENV
          "PREVIEW_NOTES=$notesPath" >> $env:GITHUB_ENV

      - name: Create the verified draft Pre-release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create $env:PREVIEW_TAG `
            $env:PREVIEW_INSTALLER `
            $env:PREVIEW_CHECKSUM `
            --repo $env:GITHUB_REPOSITORY `
            --target $env:GITHUB_SHA `
            --title $env:PREVIEW_TITLE `
            --notes-file $env:PREVIEW_NOTES `
            --draft `
            --prerelease `
            --latest=false

      - name: Publish the verified Pre-release
        if: ${{ inputs.publish == true }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit $env:PREVIEW_TAG --repo $env:GITHUB_REPOSITORY --draft=false --prerelease

      - name: Verify release metadata and downloaded assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PREVIEW_PUBLISH: ${{ inputs.publish }}
        run: |
          $release = gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/$env:PREVIEW_TAG" | ConvertFrom-Json
          if (-not $release.prerelease) {
            throw "The GitHub release is not marked as a Pre-release."
          }
          $expectedDraft = $env:PREVIEW_PUBLISH -ne "true"
          if ($release.draft -ne $expectedDraft) {
            throw "Unexpected draft state: $($release.draft); expected $expectedDraft."
          }
          if ($release.target_commitish -ne $env:GITHUB_SHA) {
            throw "Release target '$($release.target_commitish)' does not match '$env:GITHUB_SHA'."
          }

          $assetNames = @($release.assets | ForEach-Object { $_.name })
          $expectedAssets = @($env:PREVIEW_ASSET_NAME, "SHA256SUMS.txt")
          if ($assetNames.Count -ne $expectedAssets.Count) {
            throw "Unexpected release assets: $($assetNames -join ', ')"
          }
          foreach ($expectedAsset in $expectedAssets) {
            if ($assetNames -notcontains $expectedAsset) {
              throw "Release is missing '$expectedAsset'."
            }
          }

          $downloadRoot = Join-Path $env:RUNNER_TEMP "aiceland-preview-download-verification"
          New-Item -ItemType Directory -Path $downloadRoot -Force | Out-Null
          gh release download $env:PREVIEW_TAG `
            --repo $env:GITHUB_REPOSITORY `
            --pattern $env:PREVIEW_ASSET_NAME `
            --pattern SHA256SUMS.txt `
            --dir $downloadRoot

          $downloadedInstaller = Join-Path $downloadRoot $env:PREVIEW_ASSET_NAME
          $downloadedChecksum = Join-Path $downloadRoot "SHA256SUMS.txt"
          $expectedHash = ((Get-Content -Raw -LiteralPath $downloadedChecksum).Trim() -split '\s+')[0]
          $actualHash = (Get-FileHash -LiteralPath $downloadedInstaller -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne $expectedHash) {
            throw "Downloaded installer SHA-256 does not match SHA256SUMS.txt."
          }

          "Verified release: $($release.html_url)"
